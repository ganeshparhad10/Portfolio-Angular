<header class="main-navbar sticky top-0 left-0 right-0 z-50">
  <div class="navbar-inner max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      
      <!-- Brand Logo Link (matching reference) -->
      <a routerLink="/" class="brand-link flex items-center gap-2.5 group focus:outline-none" (click)="closeMenu()">
        <div class="brand-badge w-8 h-8 border-2 border-cyan-500 flex items-center justify-center font-bold text-cyan-400 font-mono text-sm transition-transform group-hover:scale-105">
          G
        </div>
        <div class="flex flex-col">
          <span class="brand-name font-bold tracking-widest text-base sm:text-lg text-white font-tech-heading uppercase">
            GANESH PARHAD
          </span>
          <span class="brand-subtitle text-[9px] font-mono tracking-[0.2em] text-cyan-400 uppercase -mt-0.5">
            JAVA BACKEND & FULL-STACK
          </span>
        </div>
      </a>

      <!-- Desktop Nav Links -->
      <nav class="hidden lg:flex items-center space-x-4 xl:space-x-6 text-[11px] xl:text-xs font-mono font-semibold uppercase tracking-widest text-gray-400">
        <a routerLink="/" [routerLinkActiveOptions]="{exact: true}" routerLinkActive="active" class="nav-link relative py-1 hover:text-white transition-colors">
          Home
          <span class="nav-active-bar"></span>
        </a>
        <a routerLink="/skills" routerLinkActive="active" class="nav-link relative py-1 hover:text-white transition-colors">
          Skills
          <span class="nav-active-bar"></span>
        </a>
        <a routerLink="/projects" routerLinkActive="active" class="nav-link relative py-1 hover:text-white transition-colors">
          Projects
          <span class="nav-active-bar"></span>
        </a>
        <a routerLink="/resume" routerLinkActive="active" class="nav-link relative py-1 hover:text-white transition-colors">
          Resume
          <span class="nav-active-bar"></span>
        </a>
        <a routerLink="/contact" routerLinkActive="active" class="nav-link relative py-1 hover:text-white transition-colors">
          Contact
          <span class="nav-active-bar"></span>
        </a>
      </nav>

      <!-- Desktop Right Actions -->
      <div class="hidden lg:flex items-center gap-2.5">
        <!-- Download Resume Action -->
        <a
          href="assets/Ganesh-Parhad.pdf"
          download="Ganesh_Parhad_Resume.pdf"
          class="btn-nav-download bg-cyan-500 hover:bg-cyan-400 text-black px-4 xl:px-5 py-2 text-[11px] xl:text-xs font-mono font-bold transition-all border border-cyan-400 uppercase tracking-wider inline-flex items-center gap-1.5 shadow-md">
          <i class="bi bi-download text-black"></i>
          <span>DOWNLOAD RESUME</span>
        </a>

        <!-- Quick Phone Action -->
        <a
          href="tel:+918421028276"
          title="Direct Phone Contact"
          class="btn-nav-phone p-2 border border-white/20 hover:border-cyan-500 text-gray-300 hover:text-white bg-[#141416] transition-colors inline-flex items-center justify-center">
          <i class="bi bi-telephone-fill text-cyan-400 text-xs"></i>
        </a>
      </div>

      <!-- Mobile Right Controls -->
      <div class="flex items-center gap-2 lg:hidden">
        <a
          href="assets/Ganesh-Parhad.pdf"
          download="Ganesh_Parhad_Resume.pdf"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-cyan-500 text-black text-xs font-mono font-bold border border-cyan-400 uppercase tracking-wider">
          <i class="bi bi-download"></i>
          <span class="hidden sm:inline">RESUME</span>
        </a>

        <!-- Mobile Toggle Button -->
        <button
          type="button"
          class="p-2 border border-white/20 hover:border-cyan-500 text-gray-300 hover:text-white bg-[#141416] transition-colors"
          (click)="toggleMenu()"
          [attr.aria-expanded]="isMenuOpen"
          aria-label="Toggle navigation">
          <i class="bi" [ngClass]="isMenuOpen ? 'bi-x-lg text-cyan-400' : 'bi-list text-white'"></i>
        </button>
      </div>

    </div>
  </div>

  <!-- Mobile Navigation Drawer -->
  <div *ngIf="isMenuOpen" class="mobile-drawer lg:hidden bg-[#141416] border-b border-cyan-500/40 px-4 pt-4 pb-6 space-y-3 shadow-2xl">
    <div class="grid grid-cols-2 gap-2 pb-3 border-b border-white/10 font-mono text-[11px] uppercase tracking-wider">
      <a routerLink="/" [routerLinkActiveOptions]="{exact: true}" routerLinkActive="active-mobile" (click)="closeMenu()" class="mobile-link p-2.5 border border-white/10 hover:border-cyan-500 bg-[#0A0A0B] text-gray-300 flex items-center gap-2">
        <i class="bi bi-house-door text-cyan-400"></i> Home
      </a>
      <a routerLink="/skills" routerLinkActive="active-mobile" (click)="closeMenu()" class="mobile-link p-2.5 border border-white/10 hover:border-cyan-500 bg-[#0A0A0B] text-gray-300 flex items-center gap-2">
        <i class="bi bi-cpu text-cyan-400"></i> Skills
      </a>
      <a routerLink="/projects" routerLinkActive="active-mobile" (click)="closeMenu()" class="mobile-link p-2.5 border border-white/10 hover:border-cyan-500 bg-[#0A0A0B] text-gray-300 flex items-center gap-2">
        <i class="bi bi-folder2 text-cyan-400"></i> Projects
      </a>
      <a routerLink="/resume" routerLinkActive="active-mobile" (click)="closeMenu()" class="mobile-link p-2.5 border border-white/10 hover:border-cyan-500 bg-[#0A0A0B] text-gray-300 flex items-center gap-2">
        <i class="bi bi-file-earmark-code text-cyan-400"></i> Resume
      </a>
      <a routerLink="/contact" routerLinkActive="active-mobile" (click)="closeMenu()" class="mobile-link col-span-2 p-2.5 border border-white/10 hover:border-cyan-500 bg-[#0A0A0B] text-gray-300 flex items-center gap-2">
        <i class="bi bi-envelope text-cyan-400"></i> Contact Ganesh
      </a>
    </div>

    <!-- Mobile Drawer Actions -->
    <div class="pt-1 flex flex-col gap-2">
      <a
        href="assets/Ganesh-Parhad.pdf"
        download="Ganesh_Parhad_Resume.pdf"
        class="w-full flex items-center justify-center gap-2 py-2.5 bg-cyan-500 hover:bg-cyan-400 text-black font-mono font-bold text-xs uppercase tracking-wider">
        <i class="bi bi-download"></i> DOWNLOAD OFFICIAL RESUME (PDF)
      </a>
      <a
        href="tel:+918421028276"
        class="w-full flex items-center justify-center gap-2 py-2.5 border border-white/15 hover:border-cyan-500 text-gray-300 font-mono text-xs bg-[#0A0A0B]">
        <i class="bi bi-telephone text-cyan-400"></i> Call: +91-8421028276
      </a>
    </div>
  </div>
</header>
