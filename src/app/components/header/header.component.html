<header class="main-navbar">
  <div class="navbar-inner">
    
    <!-- Brand Logo -->
    <a routerLink="/" class="brand-link" (click)="closeMenu()">
      <div class="brand-badge">
        G
      </div>
      <div class="brand-text">
        <span class="brand-name">
          GANESH PARHAD
        </span>
        <span class="brand-subtitle">
          JAVA BACKEND & FULL-STACK
        </span>
      </div>
    </a>

    <!-- Desktop Navigation Links (Horizontal Row) -->
    <nav class="desktop-nav">
      <a routerLink="/" [routerLinkActiveOptions]="{exact: true}" routerLinkActive="active" class="nav-item">
        <span>Home</span>
        <span class="nav-active-bar"></span>
      </a>
      <a routerLink="/skills" routerLinkActive="active" class="nav-item">
        <span>Skills</span>
        <span class="nav-active-bar"></span>
      </a>
      <a routerLink="/projects" routerLinkActive="active" class="nav-item">
        <span>Projects</span>
        <span class="nav-active-bar"></span>
      </a>
      <a routerLink="/resume" routerLinkActive="active" class="nav-item">
        <span>Resume</span>
        <span class="nav-active-bar"></span>
      </a>
      <a routerLink="/contact" routerLinkActive="active" class="nav-item">
        <span>Contact</span>
        <span class="nav-active-bar"></span>
      </a>
    </nav>

    <!-- Desktop Right Action Buttons -->
    <div class="desktop-actions">
      <!-- Download Resume Button -->
      <a
        href="assets/Ganesh-Parhad.pdf"
        download="Ganesh_Parhad_Resume.pdf"
        class="btn-nav-download"
        title="Download official PDF resume">
        <i class="bi bi-download"></i>
        <span>DOWNLOAD RESUME</span>
      </a>

      <!-- Quick Phone Call Button -->
      <a
        href="tel:+918421028276"
        title="Direct Phone: +91-8421028276"
        class="btn-nav-phone">
        <i class="bi bi-telephone-fill"></i>
      </a>
    </div>

    <!-- Mobile Right Controls (Only on mobile <= 991px) -->
    <div class="mobile-controls">
      <a
        href="assets/Ganesh-Parhad.pdf"
        download="Ganesh_Parhad_Resume.pdf"
        class="btn-mobile-resume">
        <i class="bi bi-download"></i>
        <span>RESUME</span>
      </a>

      <!-- Mobile Hamburger Button -->
      <button
        type="button"
        class="btn-mobile-toggle"
        (click)="toggleMenu()"
        [attr.aria-expanded]="isMenuOpen"
        aria-label="Toggle navigation">
        <i class="bi" [ngClass]="isMenuOpen ? 'bi-x-lg' : 'bi-list'"></i>
      </button>
    </div>

  </div>

  <!-- Mobile Dropdown Navigation Drawer -->
  <div *ngIf="isMenuOpen" class="mobile-drawer">
    <div class="mobile-links-grid">
      <a routerLink="/" [routerLinkActiveOptions]="{exact: true}" routerLinkActive="active-mobile" (click)="closeMenu()" class="mobile-drawer-link">
        <i class="bi bi-house-door text-cyan-400"></i>
        <span>Home</span>
      </a>
      <a routerLink="/skills" routerLinkActive="active-mobile" (click)="closeMenu()" class="mobile-drawer-link">
        <i class="bi bi-cpu text-cyan-400"></i>
        <span>Skills</span>
      </a>
      <a routerLink="/projects" routerLinkActive="active-mobile" (click)="closeMenu()" class="mobile-drawer-link">
        <i class="bi bi-folder2 text-cyan-400"></i>
        <span>Projects</span>
      </a>
      <a routerLink="/resume" routerLinkActive="active-mobile" (click)="closeMenu()" class="mobile-drawer-link">
        <i class="bi bi-file-earmark-code text-cyan-400"></i>
        <span>Resume</span>
      </a>
      <a routerLink="/contact" routerLinkActive="active-mobile" (click)="closeMenu()" class="mobile-drawer-link col-full">
        <i class="bi bi-envelope text-cyan-400"></i>
        <span>Contact Ganesh</span>
      </a>
    </div>

    <!-- Mobile Drawer Buttons -->
    <div class="mobile-drawer-actions">
      <a
        href="assets/Ganesh-Parhad.pdf"
        download="Ganesh_Parhad_Resume.pdf"
        class="mobile-drawer-download">
        <i class="bi bi-download"></i>
        <span>DOWNLOAD OFFICIAL RESUME (PDF)</span>
      </a>
      <a
        href="tel:+918421028276"
        class="mobile-drawer-phone">
        <i class="bi bi-telephone-fill"></i>
        <span>Call: +91-8421028276</span>
      </a>
    </div>
  </div>
</header>
