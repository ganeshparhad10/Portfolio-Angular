<div class="skills-page">
  <div class="section-container">
    <!-- Header -->
    <div class="section-header">
      <span class="section-badge"><i class="bi bi-cpu-fill"></i> Technical Expertise</span>
      <h1 class="section-title">Skills & <span class="gradient-text">Core Competencies</span></h1>
      <p class="section-subtitle">
        A structured breakdown of my enterprise Java backend proficiencies, modern frontend tools, and AI integrations.
      </p>
    </div>

    <!-- Skills Category Sections -->
    <div class="skills-categories-grid">
      <div *ngFor="let category of skillCategories" class="category-card glass-card">
        <div class="category-header">
          <div class="category-icon-wrapper">
            <i [class]="category.icon"></i>
          </div>
          <h2 class="category-title">{{ category.title }}</h2>
        </div>

        <div class="skills-items-grid">
          <div *ngFor="let skill of category.skills" class="skill-item">
            <div class="skill-icon-box">
              <i *ngIf="skill.isBootstrapIcon" [class]="skill.iconClass"></i>
              <i *ngIf="!skill.isBootstrapIcon" [class]="skill.iconClass"></i>
            </div>
            <div class="skill-info">
              <span class="skill-name">{{ skill.name }}</span>
              <span class="skill-level">{{ skill.level }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
