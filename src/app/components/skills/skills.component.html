<div class="skills-page">
  <div class="section-container">
    <div class="section-header">
      <span class="section-label">Competencies</span>
      <h1 class="section-title">Technical Skills</h1>
      <p class="section-subtitle">
        Languages, enterprise frameworks, database technologies, and developer tooling used across my projects.
      </p>
    </div>

    <div class="skills-grid">
      <div *ngFor="let category of skillCategories" class="skills-group card-clean">
        <div class="group-header">
          <i [class]="category.icon" class="group-icon"></i>
          <h2 class="group-title">{{ category.title }}</h2>
        </div>

        <div class="skills-pill-wrap">
          <div *ngFor="let skill of category.skills" class="skill-chip">
            <i [class]="skill.iconClass" class="skill-icon"></i>
            <span class="skill-name">{{ skill.name }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
